plugins {
    id "com.android.application"
}

def cargoAbis = ["arm64-v8a", "armeabi-v7a", "x86_64"]

android {
    ndkVersion "30.0.16248370"
    namespace "com.tein.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.tein.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            def ks = file(System.getenv("TEIN_KEYSTORE") ?: "${rootDir}/tein-release.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("TEIN_KEYSTORE_PASSWORD") ?: "tein123"
                keyAlias System.getenv("TEIN_KEY_ALIAS") ?: "tein"
                keyPassword System.getenv("TEIN_KEY_PASSWORD") ?: "tein123"
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            enable project.hasProperty("splitAbi")
            reset()
            include(*cargoAbis)
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Builds the Rust library for every ABI into jniLibs before packaging.
tasks.register("cargoBuild", Exec) {
    workingDir "${rootDir}/.."
    def abis = (project.findProperty("abis") ?: cargoAbis.join(",")).split(",")
    def args = ["cargo", "ndk", "-P", "26", "-o", "${projectDir}/src/main/jniLibs"]
    abis.each { args += ["-t", it] }
    args += ["build", "--release", "--lib"]
    commandLine args
}
preBuild.dependsOn "cargoBuild"
