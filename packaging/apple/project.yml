name: Tein
options:
  bundleIdPrefix: io.github.maurezg7
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Tein:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.maurezg7.tein
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
    info:
      path: Generated-Info.plist
      properties:
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postCompileScripts:
      - name: Compilar Tein con Cargo
        script: bash "$SRCROOT/ios-build.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
schemes:
  Tein:
    build:
      targets:
        Tein: all
