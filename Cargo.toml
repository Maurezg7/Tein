[package]
name = "ritmo"
version = "0.1.0"
edition = "2024"
description = "Reproductor de música liviano para Android hecho en Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ritmo-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "image-default-formats", "renderer-femtovg"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
lofty = "0.25"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
fastrand = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "renderer-software"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "image-default-formats", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
