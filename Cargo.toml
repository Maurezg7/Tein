[package]
name = "tein"
version = "0.1.0"
edition = "2024"
description = "Reproductor de música multiplataforma hecho en Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tein-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "image-default-formats", "renderer-femtovg"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
lofty = "0.25"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
httpdate = "1.0.3"
log = "0.4"
fastrand = "2"
rusty-chromaprint = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "renderer-software"] }
dirs = "6"
webbrowser = { version = "1", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "image-default-formats", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
